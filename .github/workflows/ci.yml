# Mỗi lần push hoặc mở pull request: chạy kiểm tra và build thử.
# Phần deploy do Vercel tự làm khi push lên main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
